<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Golfboet – Kommer snart</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a2e1a;
      color: #f5f0e8;
      font-family: Georgia, 'Times New Roman', serif;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 480px;
    }

    .logo {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a8c5a0;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      color: #f5f0e8;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      color: #c8bfad;
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: #a8c5a0;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Golfboet</div>
    <h1>Kommer snart</h1>
    <div class="divider"></div>
    <p>Vi håller på att göra klart något alldeles nytt.<br>Återkom inom kort.</p>
  </div>
</body>
</html>
