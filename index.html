<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Golfboet – Kommer snart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0F1113;
      color: #FFFFFF;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 480px;
    }

    .logo {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #66BB6A;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.75rem, 3.5vw, 2.625rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      color: #FFFFFF;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      color: #B0B7C3;
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: #2E7D32;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Golfboet</div>
    <h1>Kommer snart</h1>
    <div class="divider"></div>
    <p>Vi håller på att göra klart något alldeles nytt.<br>Återkom inom kort.</p>
  </div>
</body>
</html>
